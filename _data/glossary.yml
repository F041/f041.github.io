- id: economia-programmata-partecipata
  term: economia programmata partecipata
  def: "Il modello del sito, ovvero pianificazione unita alla partecipazione attiva di lavoratori e cittadini."

- id: legge-del-valore
  term: legge del valore
  def: Il valore di una merce dipende dal lavoro medio necessario a produrla; il prezzo ne è solo la traccia fluttuante.

- id: costo-marginale
  term: costo marginale
  def: Quanto costa produrre un'unità in più di un bene o servizio; nel digitale tende a zero.

- id: economia-di-scala
  term: economia di scala
  def: Produrre in grandi quantità abbassa il costo medio per singola unità.

- id: valore-di-scambio
  term: valore di scambio
  def: Il rapporto, espresso dal prezzo, in cui una merce si scambia con le altre.

- id: valore-duso
  term: valore d'uso
  def: L'utilità concreta di un bene per soddisfare un bisogno umano.

- id: bilancio-materiale
  term: bilancio materiale
  def: Schema contabile che fa combaciare quanto serve e quanto si produce di ogni bene.

- id: monopolio
  term: monopolio
  def: Un solo venditore domina il mercato e impone prezzi e condizioni.

- id: monopsonio
  term: monopsonio
  def: Un solo compratore domina il mercato e può imporre prezzi al ribasso.

- id: cogestione
  term: cogestione
  def: Partecipazione dei lavoratori alle decisioni aziendali, di solito parziale.

- id: quota-di-mercato
  term: quota di mercato
  def: La parte di un mercato controllata da una singola azienda.

- id: filiera
  term: filiera
  def: L'intera catena che porta un bene dal produttore al consumatore.

- id: dazi
  term: dazi
  def: Imposte sulle merci importate, che alzano il prezzo dei prodotti esteri per proteggere la produzione interna.

- id: esproprio
  term: esproprio
  def: Trasferimento (anche forzoso) di una proprietà, spesso deciso da chi detiene il potere e spesso senza un indennizzo adeguato.

- id: indennizzo
  term: indennizzo
  def: La somma che dovrebbe compensare chi perde una proprietà, ma che nella pratica l'esproprio spesso non prevede.

- id: cooperativa
  term: cooperativa
  def: Impresa in cui i lavoratori sono anche soci e partecipano a decisioni e risultati.

- id: gosplan
  term: Gosplan
  def: L'agenzia centrale di pianificazione dell'URSS, autrice dei piani quinquennali.

- id: piano-quinquennale
  term: piano quinquennale
  def: Piano economico sovietico che fissava gli obiettivi di produzione su 5 anni, da correggere a metà solo a prezzo di ammettere un fallimento.

- id: surplus
  term: surplus
  def: L'eccesso di produzione che resta quando si produce più di quanto serve.

- id: domanda-e-offerta
  term: domanda e offerta
  def: L'incontro tra chi compra e chi vende, che determina i prezzi di mercato.

- id: economia-amministrata
  term: economia amministrata
  def: Una pianificazione che decide dall'alto senza partecipazione, con dati spesso distorti dalla burocrazia.

- id: costo-medio
  term: costo medio
  def: Il costo totale di produzione diviso per le unità prodotte, che scende con l'economia di scala.