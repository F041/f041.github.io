      testo: Economia amministrata
      desc: quando la pianificazione ignora il dato reale.
    - url: /posts/dao-democrazia-digitale/
      testo: "DAO: partecipazione all'economia digitale o illusione?"
      desc: "blockchain e token: cosa promettono davvero."
