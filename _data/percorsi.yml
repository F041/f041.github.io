# Percorsi di lettura: unica fonte per la pagina /percorsi/, la homepage e la barra del percorso negli articoli.
# - id: usato nei link (?percorso=id) per ricordare in quale percorso si sta leggendo
# - ancora: l'id del titolo nella pagina /percorsi/ (generato da kramdown dal campo `titolo`)
# - passi: gli articoli in ordine; `testo` è il testo del link, `desc` la spiegazione (accetta markdown)
# L'ordine qui è quello della pagina /percorsi/; in homepage il percorso con `badge` va per primo.

- id: informatica
