<!-- ===== Custom metadata hook: tooltip del glossario ===== -->

<style>
  .glossary-tip {
    cursor: help;
    position: relative;
    color: inherit;
    background: linear-gradient(transparent 60%, var(--epp-highlight, #f2d555) 60%);
    padding: 0 1px;
  }
  .glossary-tip::after {
    content: attr(data-def);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 8px);
    transform: translateX(-50%) translateY(4px);
    width: max-content;
    max-width: 280px;
    padding: 0.5rem 0.75rem;
    border-radius: 0;
    background: var(--epp-ink, #15171a);
    color: var(--epp-bg, #f1f1ee);
    border: 0;
    font-family: var(--epp-font-display, sans-serif);
    font-style: normal;
    font-size: 0.85rem;
    line-height: 1.45;
    text-align: left;
    font-weight: 400;
    white-space: normal;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 20;
  }
  .glossary-tip:hover::after,
  .glossary-tip:focus::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>

<script id="glossary-data" type="application/json">
{{ site.data.glossary | jsonify }}
</script>
<script defer src="{{ '/assets/js/glossary-tooltip.js' | relative_url }}"></script>
