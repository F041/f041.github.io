<!-- ===== Custom metadata hook: tooltip del glossario ===== -->

<style>
  /* termine del glossario: pulsante con pennarello giallo e sottolineatura tratteggiata,
     diverso dai link normali (sottolineatura piena) */
  .glossary-tip {
    display: inline;
    margin: 0;
    padding: 0 1px;
    border: 0;
    border-bottom: 1px dotted var(--epp-ink, #15171a);
    border-radius: 0;
    background: linear-gradient(transparent 62%, var(--epp-highlight, #f2d555) 62%);
    color: inherit;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  .glossary-tip[aria-expanded='true'] {
    background: var(--epp-highlight, #f2d555);
  }
  .glossary-def {
    display: block;
    margin: 0.75rem 0 1.25rem;
    padding: 14px 18px;
    background: var(--epp-ink, #15171a);
    color: var(--epp-bg, #f1f1ee);
    font-family: var(--epp-font-display, sans-serif);
    font-style: normal;
    font-size: 1rem;
    line-height: 1.5;
    word-spacing: 0.04em;
  }
  .glossary-def__label {
    display: block;
    margin-bottom: 4px;
    font-family: var(--epp-font-mono, monospace);
    font-size: 0.75rem;
    color: var(--epp-highlight, #f2d555);
  }
  .glossary-hint {
    margin: 0 0 2rem;
    padding: 12px 16px;
    background: var(--epp-band, #e6e6e1);
    font-family: var(--epp-font-display, sans-serif);
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--epp-text, #2c2f33);
  }
  .content .glossary-def a:not(.img-link) {
    color: var(--epp-bg, #f1f1ee);
    text-decoration-color: currentColor;
  }
</style>

<script id="glossary-data" type="application/json" data-glossary-url="{{ '/glossario/' | relative_url }}">
{{ site.data.glossary | jsonify }}
</script>
<script defer src="{{ '/assets/js/glossary-tooltip.js' | relative_url }}"></script>
